# Check docs/ and publish it to GitHub Pages.  The check job uploads the site
# only after the same `mise run docs-check' a developer runs has passed, and the
# deploy job publishes that one artifact.  Keeping the upload out of the deploy
# job means re-running a failed deploy reuses the artifact instead of uploading
# a second one, which deploy-pages refuses, and it gives the artifact time to
# show up in the run's listing before deploy-pages asks for it.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "VERSION"
      - "scripts/**"
      - ".markdownlint*"
      - "mise.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Trust this checkout's mise.toml without a prompt, and install only the
      # one tool the checks need rather than every pinned tool.
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.15
          install_args: "npm:markdownlint-cli"
      - run: mise run docs-check
      # The action tars with --dereference, so docs/VERSION ships as a file.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
